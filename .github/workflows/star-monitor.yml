name: Star monitor

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Record star count and detect milestones
        uses: actions/github-script@v7
        with:
          script: |
            const path = '.github/star-monitor.json';
            const { owner, repo } = context.repo;
            const { data: repository } = await github.rest.repos.get({ owner, repo });
            const stars = repository.stargazers_count;
            let previous = 0;
            let sha;

            try {
              const { data: current } = await github.rest.repos.getContent({ owner, repo, path });
              sha = current.sha;
              previous = JSON.parse(Buffer.from(current.content, 'base64').toString('utf8')).stars || 0;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const payload = JSON.stringify({
              stars,
              checkedAt: new Date().toISOString()
            }, null, 2) + '\n';

            if (stars !== previous) {
              await github.rest.repos.createOrUpdateFileContents({
                owner,
                repo,
                path,
                message: 'chore: update star count to ' + stars,
                content: Buffer.from(payload).toString('base64'),
                sha
              });
            }

            await core.summary
              .addHeading('Repository stars')
              .addTable([
                [{ data: 'Previous', header: true }, { data: 'Current', header: true }],
                [String(previous), String(stars)]
              ])
              .write();

            const milestones = [10, 25, 50, 100, 250, 500, 1000, 2500, 5000, 10000];
            const reached = milestones.filter((milestone) => previous < milestone && stars >= milestone).at(-1);
            if (reached) {
              await github.rest.issues.create({
                owner,
                repo,
                title: 'Star milestone: ' + reached,
                body: 'The repository reached **' + stars + '** stars during the scheduled check.\n\nDetected milestone: ' + reached + '.'
              });
            }
